name: Deploy MLAcademy
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: 'npm'
          cache-dependency-path: AcademyFrontend/package-lock.json
      - name: Install & Build
        run: |
          cd AcademyFrontend
          npm install
          npm run build