name: Deploy MLAcademy
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Deploy Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: 'npm'
          cache-dependency-path: AcademyFrontend/package-lock.json
      - name: Install & Build
        run: |
          cd AcademyFrontend
          npm install
          npm run build

  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_ML }}" ]; then
            echo "Erreur: Le secret RENDER_DEPLOY_HOOK_ML n'est pas configuré."
            echo "Veuillez l'ajouter dans les secrets GitHub de votre dépôt."
            exit 1
          fi
          echo "Déclenchement du déploiement Render..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_ML }}"
          echo "Déploiement initié avec succès!"