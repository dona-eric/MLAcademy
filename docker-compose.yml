
services:
  backend:
    build:
      context: ./MLBackend
      dockerfile: Dockerfile
    image: mlacademy-backend:latest
    container_name: mlacademy-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./MLBackend/.env
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.8
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: mlacademy_search_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

volumes:
  redis_data:
  meili_data:
